[project]
name = "matte-lab"
version = "0.1.0"
description = "Offline replay of recorded LensLink takes through cutout methods"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "av",
    "torch",
    "torchvision",
    "opencv-python-headless",
    "omegaconf>=2.3.1",
    "hydra-core>=1.3.7",
    "einops>=0.8.2",
    "easydict>=1.13",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
    "imageio>=2.38.1",
    "huggingface-hub>=2.2.0",
    "safetensors>=0.8.0",
]

[tool.uv]
package = false
